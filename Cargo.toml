[workspace]
resolver = "2"
members = ["crates/cypher-guard", "crates/nexus-scout-types", "crates/nexus-scout", "crates/nexus-scout-cli"]

[workspace.package]
edition = "2021"
# Floor of the locked dependency tree; enforced by the `msrv` CI job.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pubky/nexus-scout"

# Public-API deps: a major bump of serde_json or neo4rs is a breaking release of
# the affected crate(s). neo4rs is pinned to the production version; bump in lockstep.
[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "signal"] }
clap = { version = "4.6", features = ["derive"] }
unicode-normalization = "0.1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
neo4rs = "=0.8.0"
# HTTP server tier (behind the `http` feature).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# `util` provides ServiceExt::oneshot for DB-free handler tests.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "catch-panic", "request-id", "timeout"] }
# Blocking HTTP client for the scout CLI (rustls).
ureq = { version = "2", default-features = false, features = ["tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# warn locally so build/test stay green; CI promotes with -D warnings.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[profile.release]
strip = true

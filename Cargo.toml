[workspace]
resolver = "2"
members = ["crates/cypher-guard", "crates/nexus-scout-types", "crates/nexus-scout", "crates/nexus-scout-cli"]

[workspace.package]
edition = "2021"
# The real floor of the locked dependency tree (idna/icu need 1.86, darling 1.88);
# enforced by the `msrv` CI job. Bump in lockstep with a dependency that raises it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pubky/nexus-scout"

# Public-API dependencies: a major bump here is a breaking release of both
# crates (they appear in public signatures). neo4rs is pinned to match the
# version nexus runs in production; bump only in lockstep with nexus-common.
[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "signal"] }
clap = { version = "4.6", features = ["derive"] }
unicode-normalization = "0.1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
neo4rs = "=0.8.0"
# HTTP server tier (optional, behind the `http` feature on nexus-scout).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6", features = ["limit", "trace", "catch-panic", "request-id", "timeout"] }
# Blocking HTTP client for the `scout` CLI (rustls; reuses the vendored TLS stack).
ureq = { version = "2", default-features = false, features = ["tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Enabled at `warn` so local `cargo build`/`test` stay green; CI promotes the
# whole set with `cargo clippy -- -D warnings`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[profile.release]
strip = true

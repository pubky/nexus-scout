[package]
name = "nexus-scout"
version = "0.1.0"
description = "Read-only Cypher query gateway between AI agents and the Pubky social graph."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "nexus_scout"

[[bin]]
name = "nexus-scout"
path = "src/main.rs"

[dependencies]
cypher-guard = { path = "../cypher-guard" }
nexus-scout-types = { path = "../nexus-scout-types" }
neo4rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { version = "1", features = ["server", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
static_assertions = "1"
tower = { workspace = true }
axum = { workspace = true }

[features]
default = ["http", "mcp"]
mcp = ["dep:rmcp", "dep:schemars"]
http = ["dep:axum", "dep:tower-http"]
integration = []

[lints]
workspace = true

[advisories]
version = 2
yanked = "deny"
# All transitive, pulled by neo4rs (and rmcp's TLS stack). These are
# "unmaintained" advisories, not vulnerabilities; they leave when neo4rs updates
# its tree. Revisit on each neo4rs bump.
ignore = [
    "RUSTSEC-2024-0384", # instant   <- backoff <- neo4rs
    "RUSTSEC-2024-0436", # paste     <- neo4rs
    "RUSTSEC-2025-0012", # backoff   <- neo4rs
    "RUSTSEC-2025-0134", # rustls-pemfile <- neo4rs / rustls-native-certs
]

[licenses]
version = 2
# CDLA-Permissive-2.0 is the Mozilla CA bundle (webpki-roots, transitive via rmcp's TLS stack).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

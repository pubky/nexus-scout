# Production stack: the gateway and Neo4j co-located, fronted by a Caddy reverse
# proxy that terminates TLS. ONLY Caddy is public — neither Neo4j nor the gateway
# publishes a host port, so the Bolt port and DB credentials never leave the box.
#
# Set SCOUT_DOMAIN, NEO4J_ADMIN_PASSWORD and NEO4J_SCOUT_PASSWORD in a `.env` file
# next to this one, then:
#   docker compose -f docker/docker-compose.prod.yml up -d
# Provision the reader user once Neo4j is healthy:
#   docker compose -f docker/docker-compose.prod.yml exec -T neo4j \
#     cypher-shell -u neo4j -p "$NEO4J_ADMIN_PASSWORD" \
#     < scripts/neo4j_reader_setup_community.cypher
#
# The gateway runs with NEXUS_SCOUT_PROFILE=production, so it refuses to start if
# the server-side cost bounds below are unset, or if NEO4J_URI is plaintext to a
# remote host. See docs/deployment.md.
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_ADMIN_PASSWORD:?set NEO4J_ADMIN_PASSWORD}
      # The authoritative per-query cost bounds (verified by the gateway /ready gate).
      NEO4J_db_transaction_timeout: 10s
      NEO4J_db_memory_transaction_max: 64m
      NEO4J_dbms_memory_transaction_total_max: 512m
    volumes:
      - neo4j-data:/data
    # No published ports: reachable only on the internal network.
    restart: unless-stopped

  nexus-scout:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: nexus_scout_reader
      NEO4J_PASSWORD: ${NEO4J_SCOUT_PASSWORD:?set NEO4J_SCOUT_PASSWORD}
      HTTP_ADDR: 0.0.0.0:8080
      NEXUS_SCOUT_PROFILE: production
      RUST_LOG: nexus_scout=info,tower_http=info
    depends_on:
      - neo4j
    # No published ports: only Caddy is public.
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SCOUT_DOMAIN: ${SCOUT_DOMAIN:?set SCOUT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nexus-scout
    restart: unless-stopped

volumes:
  neo4j-data:
  caddy-data:
  caddy-config:

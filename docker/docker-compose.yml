# Local development + integration stack: Neo4j pinned to the version nexus runs
# in production. Use `docker compose -f docker/docker-compose.yml up -d`, then run
# scripts/neo4j_reader_setup_community.cypher once the database is healthy (this
# image is Community; the reader user it creates can write, so the sanitizer is
# the sole write guard here).
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/testtest12
      # Server-side bounds (defense layer 2's real teeth).
      NEO4J_db_transaction_timeout: 10s
      NEO4J_dbms_memory_transaction_total_max: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  nexus-scout:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: nexus_scout_reader
      NEO4J_PASSWORD: ${NEO4J_SCOUT_PASSWORD:-change-me-in-production}
      RUST_LOG: nexus_scout=info
    depends_on:
      neo4j:
        condition: service_healthy
    # stdio MCP server: connect via `docker compose exec`, or override the
    # command to run one-off `query` invocations.
    command: ["serve", "--transport", "stdio"]

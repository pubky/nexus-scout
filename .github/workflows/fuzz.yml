name: fuzz
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
jobs:
  fuzz-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run sanitize -- -max_total_time=300
        working-directory: crates/cypher-guard
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/cypher-guard/fuzz/artifacts
